# Real-time tuning shared by all images (EVL and PREEMPT_RT), applied last.

# Needed to change options that are only visible with EXPERT, e.g. SLUB_DEBUG
CONFIG_EXPERT=y

# Fully preemptible in-band kernel; PREEMPT_RT builds on top of it
CONFIG_PREEMPT=y

# Disable lock correctness checks and tracing as they add latency
CONFIG_DEBUG_ATOMIC_SLEEP=y
CONFIG_DEBUG_LOCK_ALLOC=n
CONFIG_PROVE_LOCKING=n
CONFIG_LOCKDEP=n
CONFIG_FTRACE=n

# Make sure that the CPU does not scale down
CONFIG_CPU_FREQ=n
CONFIG_CPU_IDLE=n

# Stop the tick on the isolated CPUs given by nohz_full= on the kernel command line
CONFIG_NO_HZ=n
CONFIG_NO_HZ_IDLE=n
CONFIG_HZ_PERIODIC=n
CONFIG_NO_HZ_FULL=y
CONFIG_HZ_250=y
CONFIG_HZ=250

# Let rcu_nocbs= on the kernel command line offload RCU callbacks
CONFIG_RCU_EXPERT=y
CONFIG_RCU_NOCB_CPU=y

# Disable all power management features
CONFIG_SUSPEND=n
CONFIG_HIBERNATION=n
CONFIG_PM=n

# Deterministic allocator without debugging
CONFIG_SLUB=y
CONFIG_SLUB_DEBUG=n

CONFIG_ACPI_PROCESSOR=n
CONFIG_COMPACTION=n
CONFIG_SWAP=n

CONFIG_CMA=y
CONFIG_DMA_CMA=y
