header:
  version: 10
  includes:
    - kas/rt-test-image.yml

machine: rpi4
target: rt-test-image-evl
distro: rt-test-xenomai

local_conf_header:
  hostname: |
    MACHINE_HOSTNAME = "rt-test-rpi4-evl"
  kernel: |
    KERNEL_NAME = "xenomai-4"
    PREFERRED_VERSION_linux-xenomai-4 = "7.2"
  wks: |
    WKS_FILE_NAME = "rpi4.wks"
  arch: |
    COMPAT_DISTRO_ARCH = "armhf"
